<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Nisayon episode investigation</title>
  <desc id="desc">Design study, not implemented UI. A native scripted CPU fixture starts at state 41 and ends at 42. Same-step autoreset returns 141 for the next episode. The original saved record contains 41 then 141. The corrected record contains 41 then 42, with live policy inputs unchanged. Combined with the upstream metric correction, 41 selected software checks pass. Diagram positions represent event order, not elapsed time or physical coordinates.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101215"/><stop offset="1" stop-color="#07080a"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#2d333b"/><stop offset="1" stop-color="#161a20"/></linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#909eaf" stop-opacity="0.7"/><stop offset="1" stop-color="#909eaf" stop-opacity="0.1"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#aab6c4" stroke-width="1.2"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a4c4e7" stroke-width="1.2"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#f1f1ec}
      .minor{fill:#b2b7c0}.mono{font-family:Menlo,Consolas,monospace}
      .rule{stroke:#333942;stroke-width:1}.quiet{fill:#c3c9d1}
      .blue{fill:#a4c4e7}.red{fill:#ee9c91}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="url(#ground)"/>
  <path d="M21 76V34A13 13 0 0 1 45.2583 27.5L61.0718 54.89A8 8 0 0 0 76 50.89V21" transform="translate(51 28) scale(.44)" fill="none" stroke="#f2f2ee" stroke-width="8" stroke-linecap="round"/>
  <text x="108" y="59" font-size="23" font-weight="600">Nisayon</text>
  <text x="287" y="57" font-size="16" class="minor">Study</text><text x="353" y="57" font-size="16" class="minor">/</text>
  <text x="378" y="57" font-size="16">Native evaluation</text>
  <text x="1534" y="57" text-anchor="end" font-size="14" class="minor" letter-spacing="1">DESIGN STUDY · 12 OCT 2026</text>
  <path d="M64 88H1536" class="rule"/>
  <text x="64" y="137" font-size="14" class="minor" letter-spacing="1.7">LEROBOT / EPISODE BOUNDARY</text>
  <text x="64" y="202" font-size="49" letter-spacing="-1.8">Keep the episode’s</text>
  <text x="64" y="257" font-size="49" letter-spacing="-1.8">actual final observation.</text>
  <text x="64" y="302" font-size="19" class="quiet">The next reset belongs to the next episode.</text>
  <text x="64" y="332" font-size="19" class="quiet">Live inference and the saved record need different successors.</text>
  <path d="M1138 121V899" class="rule"/>
  <text x="1180" y="144" font-size="14" class="minor" letter-spacing="1.6">SCOPED RESULT</text>
  <text x="1176" y="233" font-size="91" letter-spacing="-5">41</text><text x="1290" y="229" font-size="23">checks pass</text>
  <text x="1180" y="270" font-size="17" class="quiet">Combined correction · no skips</text>
  <path d="M1180 302H1536" class="rule"/>
  <text x="1180" y="343" font-size="18">13</text><text x="1222" y="343" font-size="17" class="quiet">selected upstream checks</text>
  <text x="1180" y="378" font-size="18">24</text><text x="1222" y="378" font-size="17" class="quiet">state and lifecycle checks</text>
  <text x="1180" y="413" font-size="18">4</text><text x="1222" y="413" font-size="17" class="quiet">nested-image checks</text>
  <path d="M1180 448H1536" class="rule"/>
  <text x="1180" y="488" font-size="14" class="minor" letter-spacing="1.2">WHAT STAYS THE SAME</text>
  <text x="1180" y="527" font-size="20">Policy inputs</text><text x="1536" y="527" text-anchor="end" font-size="16" class="blue">exactly equal</text>
  <text x="1180" y="565" font-size="20">Executed actions</text><text x="1536" y="565" text-anchor="end" font-size="16" class="blue">exactly equal</text>
  <text x="1180" y="625" font-size="14" class="minor" letter-spacing="1.2">BOUNDARY</text>
  <text x="1180" y="662" font-size="18" class="quiet">Scripted CPU policy.</text>
  <text x="1180" y="690" font-size="18" class="quiet">Native Gym and evaluator.</text>
  <text x="1180" y="730" font-size="17" class="quiet">Robot behavior and savings</text>
  <text x="1180" y="756" font-size="17" class="quiet">remain unqualified.</text>
  <path d="M1180 797H1536" class="rule"/>
  <text x="1180" y="833" font-size="16" class="quiet">Metric correction: upstream #4485.</text>
  <text x="1180" y="860" font-size="16" class="quiet">Terminal-record correction: this case.</text>
  <text x="64" y="394" font-size="14" class="minor" letter-spacing="1.4">01 / FOLLOW THE OBSERVATION</text>
  <text x="64" y="420" font-size="14" class="minor">One environment · episode 0 · state component 0 · schematic event order</text>
  <path d="M135 498H377" stroke="#aab6c4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="237" y="477" text-anchor="middle" font-size="16" class="quiet">apply action</text>
  <path d="M551 498H914" stroke="#aab6c4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="741" y="477" text-anchor="middle" font-size="16" class="quiet">same-step reset</text>
  <circle cx="110" cy="498" r="24" fill="#0c0e11" stroke="#aab6c4" stroke-width="1.2"/>
  <text x="110" y="505" text-anchor="middle" font-size="19" class="mono">41</text>
  <text x="110" y="549" text-anchor="middle" font-size="16" class="quiet">start</text>
  <path d="M382 478L421 452H544L505 478Z" fill="#343f4b" stroke="url(#lip)"/>
  <path d="M382 478H505V538H382Z" fill="url(#surface)" stroke="#647588"/>
  <path d="M505 478L544 452V512L505 538Z" fill="#1b2530" stroke="#526274"/>
  <text x="444" y="519" text-anchor="middle" font-size="37" class="mono blue">42</text>
  <text x="444" y="573" text-anchor="middle" font-size="17">actual terminal state</text>
  <text x="444" y="599" text-anchor="middle" font-size="14" class="mono minor">info[final_obs]</text>
  <path d="M684 450V594" stroke="#8694a5" stroke-width="1" stroke-dasharray="3 6"/>
  <text x="684" y="621" text-anchor="middle" font-size="14" class="minor">episode boundary</text>
  <circle cx="956" cy="498" r="38" fill="#15181d" stroke="#858e9a" stroke-width="1.2"/>
  <text x="956" y="508" text-anchor="middle" font-size="28" class="mono">141</text>
  <text x="956" y="573" text-anchor="middle" font-size="17">next reset</text>
  <text x="956" y="599" text-anchor="middle" font-size="14" class="minor">returned to live policy</text>
  <path d="M64 653H1092" class="rule"/>
  <text x="64" y="694" font-size="14" class="minor" letter-spacing="1.4">02 / COMPARE THE SAVED RECORD</text>
  <text x="64" y="750" font-size="18" class="quiet">Original</text>
  <text x="285" y="750" font-size="24" class="mono">41</text>
  <path d="M340 742H514" stroke="#858e9a" marker-end="url(#arrow)"/>
  <text x="548" y="750" font-size="27" class="mono red">141</text>
  <path d="M635 723L644 742L626 742Z" fill="none" stroke="#ee9c91" stroke-width="1.4"/>
  <text x="671" y="748" font-size="17" class="red">Next episode entered this record</text>
  <text x="64" y="817" font-size="18" class="quiet">Corrected</text>
  <text x="285" y="817" font-size="24" class="mono">41</text>
  <path d="M340 809H514" stroke="#a4c4e7" marker-end="url(#blueArrow)"/>
  <text x="548" y="817" font-size="27" class="mono blue">42</text>
  <path d="M626 809L633 816L647 799" fill="none" stroke="#a4c4e7" stroke-width="1.8"/>
  <text x="671" y="815" font-size="17" class="blue">Actual terminal state retained</text>
  <text x="64" y="872" font-size="14" class="minor">Unitless fixture state. Diagram spacing is not elapsed time or physical distance.</text>
  <path d="M64 914H1536" class="rule"/>
  <text x="64" y="952" font-size="15" class="quiet">Change</text><text x="159" y="952" font-size="15" class="blue">Witness</text><text x="261" y="952" font-size="15" class="quiet">Checks</text><text x="348" y="952" font-size="15" class="quiet">Source &amp; limits</text>
  <path d="M159 965H218" stroke="#a4c4e7" stroke-width="2"/>
  <text x="1536" y="952" text-anchor="end" font-size="15" class="mono minor">source d6db556a · retained 12 Oct</text>
  <text x="64" y="1005" font-size="13" class="minor">PROPOSED COMPOSITION — NOT AN IMPLEMENTED OR BROWSER-QUALIFIED SCREEN</text>
  <text x="1536" y="1005" text-anchor="end" font-size="13" class="minor">Exact values from the retained native evaluator witnesses</text>
