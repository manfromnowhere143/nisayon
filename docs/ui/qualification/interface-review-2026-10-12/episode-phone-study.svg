  <text x="24" y="649" font-size="15" class="minor">The next episode entered this record.</text>
  <text x="24" y="697" font-size="17">Corrected</text><text x="416" y="697" font-size="24" class="mono blue" text-anchor="end">41 → 42</text>
  <text x="24" y="724" font-size="15" class="minor">Live policy inputs and actions stay identical.</text>
