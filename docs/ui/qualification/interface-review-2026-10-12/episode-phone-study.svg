  <text x="24" y="150" font-size="13" class="minor">Study / Native evaluation / Episode boundary</text>
  <text x="24" y="202" font-size="34" letter-spacing="-1.2">Keep the episode’s</text>
  <text x="24" y="243" font-size="34" letter-spacing="-1.2">final observation.</text>
  <text x="24" y="282" font-size="17" class="minor">The next reset belongs to the next episode.</text>
  <text x="24" y="330" font-size="12" letter-spacing="1.2" class="minor">01 / FOLLOW THE OBSERVATION</text>
