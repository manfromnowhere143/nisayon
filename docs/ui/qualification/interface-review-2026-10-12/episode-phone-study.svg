<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1160" viewBox="0 0 440 1160" role="img" aria-labelledby="title desc">
  <title id="title">Proposed phone reading flow for the native episode case</title>
  <desc id="desc">Warm-paper design study, not implemented UI or a device screenshot. A continuous document presents the question, scripted states 41, 42 and 141, original and corrected saved records, scoped checks and source. The close control is in the header. Nothing in this study establishes browser layout, touch accessibility or performance.</desc>
  <defs><linearGradient id="facet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0e5e9"/><stop offset="1" stop-color="#c0ccd6"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20242a}.minor{fill:#555d66}.blue{fill:#345d85}.mono{font-family:Menlo,Consolas,monospace}.rule{stroke:#c6c6c2}</style></defs>
  <rect width="440" height="1160" fill="#f4f2ec"/>
