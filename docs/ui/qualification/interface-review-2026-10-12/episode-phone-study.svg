  <text x="24" y="800" font-size="47" letter-spacing="-2">41</text><text x="89" y="797" font-size="21">software checks pass</text>
  <text x="24" y="834" font-size="16" class="minor">13 upstream · 24 state/lifecycle · 4 image</text>
  <text x="24" y="877" font-size="16" class="minor">Scripted CPU policy; native Gym/evaluator.</text>
  <text x="24" y="904" font-size="16" class="minor">Robot behavior and savings are unqualified.</text>
