  <text x="50" y="466" text-anchor="middle" font-size="15" class="minor">Start</text>
  <text x="207" y="466" text-anchor="middle" font-size="15">Terminal state</text>
  <text x="367" y="466" text-anchor="middle" font-size="15" class="minor">Next reset</text>
  <text x="24" y="508" font-size="14" class="minor">Unitless scripted state · event order, not time.</text>
  <path d="M24 539H416" class="rule"/>
  <text x="24" y="577" font-size="12" letter-spacing="1.2" class="minor">02 / COMPARE THE SAVED RECORD</text>
