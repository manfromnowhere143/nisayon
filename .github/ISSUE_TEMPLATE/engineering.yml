name: Engineering task
description: A bounded change with a checkable outcome.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete failure or missing capability. Include reproduction when available.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Completion condition
      description: The observable result and the check that establishes it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Relevant code, traces, attempts, dependencies and limits. No credentials or private raw data.
