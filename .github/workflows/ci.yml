name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep
      - run: rg --version
      - run: uv sync --frozen
      - run: make check
      - name: Check the native MuJoCo recorder and replay
        run: |
          uv sync --frozen --group native
          uv run --frozen --group native python -c 'import mujoco, numpy; assert mujoco.__version__ == "3.3.2" and numpy.__version__ == "1.26.4"'
          uv run --frozen --group native python -m pytest tests/qualification/test_native*.py
      - name: Exercise the installed SDK and CLI outside Git
        run: |
          uv sync --frozen --no-dev --no-editable
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" example nisayon-owner
          "$GITHUB_WORKSPACE/.venv/bin/python" nisayon-owner/sdk_example.py --out nisayon-sdk-example
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" plan nisayon-owner/case.json --project nisayon-owner --out nisayon-cli-run --plan nisayon-cli-plan.json
          test ! -e nisayon-cli-run
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" run nisayon-cli-plan.json
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" inspect nisayon-cli-run
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" export nisayon-cli-run --out nisayon-cli-review.nisayon.zip
          mv nisayon-owner nisayon-owner-unavailable
          "$GITHUB_WORKSPACE/.venv/bin/nisayon-qualify" review nisayon-cli-review.nisayon.zip
