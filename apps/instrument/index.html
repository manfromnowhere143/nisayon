    <script>
      // Select the ground before first paint. The choice is view state, kept
      // in this browser only; it never changes evidence.
      (function () {
        var text = Number(new URLSearchParams(window.location.search).get("text") || "100");
        if (Number.isFinite(text) && text >= 50 && text <= 400 && text !== 100) {
          document.documentElement.style.fontSize = text + "%";
        }
        try {
          var stored = window.localStorage.getItem("nisayon.ground");
          var ground =
            stored === "paper" || stored === "black"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "paper"
                : "black";
          document.documentElement.setAttribute("data-ground", ground);
          document.querySelector('meta[name="theme-color"]').content = ground === "paper" ? "#f8f9fb" : "#050506";
        } catch (error) {
          document.documentElement.setAttribute("data-ground", "black");
        }
      })();
    </script>
